<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Login Anomaly Detection System</title>
<link rel="stylesheet" href="/static/css/style.css"/>
</head>
<body>

<!-- ── HEADER ──────────────────────────────────────────── -->
<header class="topbar">
  <div class="topbar-left">
    <span class="shield">🛡</span>
    <span class="brand">LoginGuard <span class="brand-sub">Anomaly Detection</span></span>
  </div>
  <div class="topbar-right">
    <span class="live-dot"></span><span class="live-label">LIVE</span>
    <span id="clock" class="clock"></span>
    <button class="btn-sim" onclick="simulate()">⟳ Simulate Events</button>
  </div>
</header>

<!-- ── STAT CARDS ─────────────────────────────────────── -->
<section class="stats-row" id="stats-row">
  <div class="stat-card" id="s-total">
    <div class="stat-label">Total Events</div>
    <div class="stat-value" id="v-total">—</div>
  </div>
  <div class="stat-card" id="s-flagged">
    <div class="stat-label">Flagged</div>
    <div class="stat-value red" id="v-flagged">—</div>
  </div>
  <div class="stat-card high">
    <div class="stat-label">High Risk</div>
    <div class="stat-value red" id="v-high">—</div>
  </div>
  <div class="stat-card medium">
    <div class="stat-label">Medium Risk</div>
    <div class="stat-value amber" id="v-medium">—</div>
  </div>
  <div class="stat-card low">
    <div class="stat-label">Low Risk</div>
    <div class="stat-value teal" id="v-low">—</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Normal</div>
    <div class="stat-value green" id="v-normal">—</div>
  </div>
</section>

<!-- ── MAIN CONTENT ───────────────────────────────────── -->
<main class="main-grid">

  <!-- LEFT: Alert Feed -->
  <section class="panel" id="panel-alerts">
    <div class="panel-header">
      <span>🚨 Real-Time Alerts</span>
      <div class="filter-row">
        <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
        <button class="filter-btn" onclick="setFilter('high',this)">High</button>
        <button class="filter-btn" onclick="setFilter('medium',this)">Medium</button>
        <button class="filter-btn" onclick="setFilter('low',this)">Low</button>
      </div>
    </div>
    <div class="alert-feed" id="alert-feed">
      <div class="loading">Loading alerts…</div>
    </div>
  </section>

  <!-- RIGHT: Detail + Chart -->
  <section class="panel-right">

    <!-- Risk Chart -->
    <div class="panel" id="panel-chart">
      <div class="panel-header"><span>📊 Risk Distribution</span></div>
      <div class="chart-wrap">
        <div class="bar-chart" id="bar-chart"></div>
      </div>
    </div>

    <!-- Event Detail -->
    <div class="panel" id="panel-detail">
      <div class="panel-header"><span>🔍 Event Detail</span></div>
      <div id="detail-body" class="detail-placeholder">
        Click any alert to see the full AI explanation →
      </div>
    </div>

  </section>
</main>

<!-- ── MODAL: Alert Detail ─────────────────────────────── -->
<div class="modal-overlay" id="modal" onclick="closeModal()">
  <div class="modal-box" onclick="event.stopPropagation()">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div id="modal-body"></div>
  </div>
</div>

<script src="/static/js/dashboard.js"></script>
</body>
</html>
